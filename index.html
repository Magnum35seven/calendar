<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orbit Calendar</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#f6f8ff">
<style>
:root{--bg:#f6f8ff;--p:#fff;--t:#1d2540;--m:#7a86a6;--b:#e3e8f6;--a:#6c63ff}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:linear-gradient(135deg,#f6f8ff,#fdf6ff 60%,#effcfa);color:var(--t);height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
h1{font-size:20px;margin:0 8px 0 0;min-width:150px}
.b{border:1px solid var(--b);background:var(--p);border-radius:10px;padding:7px 11px}.b.on,.b.pri{background:var(--a);color:#fff;border-color:var(--a)}
#qa{flex:1;min-width:200px;border:1px solid var(--b);border-radius:10px;padding:8px 12px;background:var(--p)}
#nx{font-size:12px;color:var(--m);padding:0 14px}
main{flex:1;overflow:auto;padding:0 14px 14px}
.side{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chip{border-radius:20px;padding:3px 10px;border:1px solid var(--b);background:var(--p);font-size:12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{font-size:11px;color:var(--m);text-align:center}
.cell{background:var(--p);border:1px solid var(--b);border-radius:12px;min-height:92px;padding:4px;overflow:hidden}.cell.o{opacity:.5}.cell.td{border-color:var(--a);box-shadow:0 0 0 2px #6c63ff33}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:6px;padding:2px 5px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{display:grid;grid-template-columns:44px repeat(var(--n),1fr);background:var(--p);border:1px solid var(--b);border-radius:12px}
.hr{height:48px;font-size:10px;color:var(--m);text-align:right;padding-right:4px;border-top:1px solid var(--b)}
.col{position:relative;border-left:1px solid var(--b);background:repeating-linear-gradient(var(--b) 0 1px,transparent 1px 48px)}
.col .ev{position:absolute;left:2px;right:2px;width:auto;white-space:normal;box-shadow:0 2px 6px #0002}
.ag{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:8px}
dialog{border:0;border-radius:18px;padding:20px;width:min(460px,94vw);box-shadow:0 20px 60px #2a336655}dialog::backdrop{background:#2a33664d}
label{display:block;font-size:11px;color:var(--m);margin-top:8px}dialog input,dialog select,dialog textarea{width:100%;border:1px solid var(--b);border-radius:8px;padding:7px}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:9}#ts div{background:var(--t);color:#fff;border-radius:10px;padding:9px 14px}
body.dk{--bg:#14172b;--p:#1e2340;--t:#eef1ff;--m:#9aa5c8;--b:#2e3558;background:#14172b}.ev[draggable=true]{cursor:grab}@media print{header,.side,#nx{display:none}}</style></head><body>
<header><h1 id="ti"></h1><button class="b" id="pv">‹</button><button class="b" id="td">Today</button><button class="b" id="nt">›</button>
<input id="qa" placeholder='Quick add: "Dentist tomorrow 3pm for 45m" · "Standup every week 9:30am"' autocomplete="off">
<span id="vs"></span><input id="se" class="b" placeholder="Search" style="width:110px"><button class="b" id="fr">Find free time</button><button class="b" id="mb">📆</button><button class="b" id="nb">📝 Notes</button><button class="b" id="mn">⋯</button></header>
<div id="nx"></div><div class="side" id="cl"></div><main id="mv"></main>
<dialog id="mm"><form method="dialog" id="fm" style="margin:0"><h3 style="margin:0" id="mh">Event</h3>
<label>Title<input id="t" required></label><label>Calendar<select id="c"></select></label>
<label>Starts<input id="s" type="datetime-local" required></label><label>Ends<input id="e" type="datetime-local" required></label>
<label style="display:flex;gap:6px;align-items:center"><input id="ad" type="checkbox" style="width:auto">All-day</label><label>Repeat<select id="r"><option value="">Never</option><option value="d">Daily</option><option value="w">Weekly</option><option value="m">Monthly</option><option value="y">Yearly</option></select></label>
<label>Repeat until<input id="u" type="date"></label>
<label>Reminder<select id="rm"><option value="">None</option><option>0</option><option>10</option><option>30</option><option>60</option><option>1440</option></select></label>
<label>Repeat every N (days/weeks/months/years)<input id="rn" type="number" min="1" value="1"></label><label>Travel time (minutes) — reminders fire early so you can leave on time<input id="tv" type="number" min="0" value="0"></label><label style="display:flex;gap:6px;align-items:center"><input id="kc" type="checkbox" style="width:auto">Custom colour <input id="k" type="color" value="#6c63ff" style="width:50px;padding:0"></label><label>Location<input id="l"></label><label>Notes<textarea id="d" rows="2"></textarea></label>
<div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="b" id="dl" style="color:#e11d48">Delete</button><span style="flex:1"></span><button type="button" class="b" id="cx">Cancel</button><button class="b pri">Save</button></div></form></dialog>
<dialog id="mu"><h3 style="margin:0 0 10px">Menu</h3><div style="display:grid;gap:8px">
<button class="b" data-a="ac">＋ New calendar</button><button class="b" data-a="bk">💾 Auto-backup to a file (survives browser reset)</button>
<button class="b" data-a="ex">⇩ Export JSON backup</button><button class="b" data-a="im">⇧ Import JSON backup</button>
<button class="b" data-a="ics">📅 Export .ics (Apple/Google)</button><button class="b" data-a="ii">📥 Import .ics</button>
<button class="b" data-a="nf">🔔 Enable notifications</button><button class="b" data-a="wx">🌤 Enable weather (uses your location)</button><button class="b" data-a="av">📋 Copy my availability (share free times)</button><button class="b" onclick="print()">🖨 Print</button><button class="b" onclick="document.body.classList.toggle('dk');localStorage.dk=document.body.classList.contains('dk')?1:''">🌓 Dark / light</button><button class="b" onclick="mu.close()">Close</button></div></dialog>
<dialog id="nd"><h3 style="margin:0">Notes</h3><small style="color:var(--m)">Tip: Alt+double-click a day or time slot to attach a note · type "note: …" in quick add for a general note</small>
<input id="nq" placeholder="Search notes" style="width:100%;border:1px solid var(--b);border-radius:8px;padding:7px;margin-top:8px"><div id="nl" style="max-height:28vh;overflow:auto;margin:8px 0"></div>
<form id="nf" method="dialog" style="margin:0"><input type="hidden" id="ni"><label>Title<input id="ntl"></label><label>Note<textarea id="ntx" rows="4"></textarea></label>
<label>Attach to day (blank = general note)<input id="nda" type="date"></label><label>Time slot (optional)<input id="nti" type="time"></label>
<label style="display:flex;gap:6px;align-items:center"><input id="npn" type="checkbox" style="width:auto">Pin to top</label>
<div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="b" id="nde" style="color:#e11d48">Delete</button><span style="flex:1"></span><button type="button" class="b" id="nc">Close</button><button class="b pri">Save note</button></div></form></dialog>
<dialog id="md"><div id="mc"></div></dialog><input type="file" id="fi" hidden><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),D=864e5,M=6e4;
let S={nt:[],ev:[],cal:[{id:'p',n:'Personal',c:'#6c63ff',v:1},{id:'w',n:'Work',c:'#14b8a6',v:1},{id:'f',n:'Family',c:'#f59e0b',v:1}]},view='month',cur=new Date(),Q='',fh=null,ed=null,fired=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),sd=d=>{d=new Date(d);d.setHours(0,0,0,0);return d},ad=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
const tm=x=>new Date(x).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),loc=x=>new Date(x-new Date(x).getTimezoneOffset()*M).toISOString().slice(0,16);
const db=()=>new Promise(r=>{const o=indexedDB.open('orbit',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>r(o.result)});
const kv=async(m,k,v)=>{const d=await db();return new Promise(r=>{const s=d.transaction('kv',m=='get'?'readonly':'readwrite').objectStore('kv'),q=m=='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result)})};
async function save(){await kv('put','data',S);if(fh)try{const w=await fh.createWritable();await w.write(JSON.stringify(S));await w.close()}catch(e){}render()}
function toast(m,fn){const d=document.createElement('div');d.textContent=m+' ';if(fn){const b=document.createElement('button');b.textContent='Undo';b.className='b';b.onclick=()=>{fn();d.remove()};d.append(b)}$('#ts').append(d);setTimeout(()=>d.remove(),fn?8000:5000)}
function occ(a,b){const o=[];S.ev.forEach(e=>{const c=S.cal.find(x=>x.id==e.cal);if(!c||!c.v)return;if(Q&&!(e.t+(e.l||'')+(e.d||'')).toLowerCase().includes(Q))return;const s=new Date(e.s),du=e.e-e.s;let i=0,x=s;while(x<b&&i<4000){if(e.u&&x>new Date(e.u+'T23:59'))break;if(+x+du>a&&!(e.x||[]).includes(+x))o.push({e,s:+x,f:+x+du,c:e.k||c.c});i++;if(!e.r)break;x=new Date(s);if(e.r=='d')x.setDate(s.getDate()+i*(e.n||1));else if(e.r=='w')x.setDate(s.getDate()+7*i*(e.n||1));else if(e.r=='y')x.setFullYear(s.getFullYear()+i*(e.n||1));else x.setMonth(s.getMonth()+i*(e.n||1))}});return o.sort((x,y)=>x.s-y.s)}
function nl(t){let d=sd(new Date()),h=9,m=0,du=60,r='',x;
if(x=t.match(/\bevery (day|week|month)\b/i)){r=x[1][0].toLowerCase();t=t.replace(x[0],'')}
if(x=t.match(/\bfor (\d+)\s*(h|hr|hour|m|min)\w*/i)){du=+x[1]*(x[2][0].toLowerCase()=='h'?60:1);t=t.replace(x[0],'')}
if(x=t.match(/\b(\d{1,2})(?::(\d\d))?\s*(am|pm)\b/i)||t.match(/\b(\d{1,2}):(\d\d)\b/)){h=+x[1];m=+(x[2]||0);if(x[3]){const p=x[3].toLowerCase();if(p=='pm'&&h<12)h+=12;if(p=='am'&&h==12)h=0}t=t.replace(x[0],'')}
if(/\btomorrow\b/i.test(t)){d=ad(d,1);t=t.replace(/\btomorrow\b/i,'')}else if(/\btoday\b/i.test(t))t=t.replace(/\btoday\b/i,'');else if(x=t.match(/\b(?:on |next )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i)){d=ad(d,(['sun','mon','tue','wed','thu','fri','sat'].indexOf(x[1].toLowerCase())-d.getDay()+7)%7||7);t=t.replace(x[0],'')}
const s=+d+h*36e5+m*M;return{id:crypto.randomUUID(),t:t.replace(/\b(at|on)\s*$/i,'').trim()||'Untitled',cal:S.cal[0].id,s,e:s+du*M,r,rem:10}}
function free(mins){let t=Math.ceil((Date.now()+15*M)/(15*M))*15*M;const lim=Date.now()+14*D;for(;t<lim;t+=15*M){const h=new Date(t).getHours()+new Date(t).getMinutes()/60,en=new Date(t+mins*M).getHours()+new Date(t+mins*M).getMinutes()/60;if(h<9||en>17||en<h||new Date(t).getDay()%6==0)continue;if(!occ(t,t+mins*M).length)return t}}
function render(){const L=$('#cl');L.innerHTML=S.cal.map(c=>`<button class="chip" data-id="${c.id}" style="${c.v?`background:${c.c}22;border-color:${c.c}`:'opacity:.5'}">● ${esc(c.n)}</button>`).join('');
$('#vs').innerHTML=['month','week','day','agenda'].map(v=>`<button class="b ${v==view?'on':''}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('');
const nxt=occ(Date.now(),Date.now()+30*D)[0];$('#nx').textContent=nxt?`Next up: ${nxt.e.t} · ${new Date(nxt.s).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})} (in ${Math.max(0,Math.round((nxt.s-Date.now())/M))} min)`:'Nothing coming up';
{const w=WX[loc(Date.now()).slice(0,10)],b=document.createElement('button');b.className='chip';b.id='wxb';b.textContent=localStorage.wx?(w?`${wi(w.c)} ${w.h}°/${w.l}° today`:'loading weather…'):'🌤 Enable weather';$('#nx').append(' ',b)}
const mv=$('#mv'),f=(o,s)=>`<button class="ev" draggable="true" data-i="${o.e.id}" data-s="${o.s}" style="background:${o.c}22;border-color:${o.c}">${s&&!o.e.a?tm(o.s)+' ':''}${esc(o.e.t)}</button>`;
if(view=='month'){const f1=new Date(cur.getFullYear(),cur.getMonth(),1),g=ad(f1,-f1.getDay()),oc=occ(g,ad(g,42));$('#ti').textContent=cur.toLocaleDateString([],{month:'long',year:'numeric'});
mv.innerHTML='<div class="mg">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="wd">${x}</div>`).join('')+Array.from({length:42},(_,i)=>{const d=ad(g,i),a=+d,l=oc.filter(o=>o.s<a+D&&o.f>a);return`<div class="cell ${d.getMonth()!=cur.getMonth()?'o':''} ${+sd(new Date())==a?'td':''}" data-d="${a}"><b>${d.getDate()}</b> ${wxs(loc(a).slice(0,10))}${S.nt.filter(n=>n.d==loc(a).slice(0,10)).map(n=>`<button class="ev" data-nn="${n.id}" style="background:#fef3c7;border-color:#f59e0b;color:#5b3a00">📝 ${esc(n.t||n.x)}</button>`).join('')}${l.slice(0,3).map(o=>f(o,1)).join('')}${l.length>3?`<small>+${l.length-3} more</small>`:''}</div>`}).join('')+'</div>'}
else if(view=='agenda'){const a=sd(cur);$('#ti').textContent='Agenda';let h='',last='';occ(+a,+a+60*D).forEach(o=>{const k=new Date(o.s).toDateString();if(k!=last){h+=(last?'</div>':'')+`<div class="ag"><b>${new Date(o.s).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}</b>`;last=k}h+=f(o,1)});mv.innerHTML=h?h+'</div>':'<p style="text-align:center;color:var(--m)">Nothing scheduled.</p>'}
else{const n=view=='week'?7:1,s=view=='week'?ad(sd(cur),-cur.getDay()):sd(cur),oc=occ(+s,+s+n*D);$('#ti').textContent=n==1?s.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}):s.toLocaleDateString([],{month:'short',day:'numeric'})+' – '+ad(s,6).toLocaleDateString([],{month:'short',day:'numeric'});
let h=`<div class="wk" style="--n:${n}"><div>${Array.from({length:24},(_,i)=>`<div class="hr">${i}:00</div>`).join('')}</div>`;
for(let i=0;i<n;i++){const d=+ad(s,i);h+=`<div class="col" data-d="${d}">${lay(oc.filter(o=>o.s<d+D&&o.f>d)).map(o=>{const a=Math.max(o.s,d),z=Math.min(o.f,d+D);return`<button class="ev" draggable="true" data-i="${o.e.id}" data-s="${o.s}" style="left:calc(${o.ln/o.nn*100}% + 2px);width:calc(${100/o.nn}% - 4px);right:auto;top:${(a-d)/36e5*48}px;height:${Math.max(18,(z-a)/36e5*48)}px;background:${o.c}33;border-color:${o.c}">${o.e.a?'':tm(o.s)+' '}${esc(o.e.t)}</button>`}).join('')}${S.nt.filter(n=>n.d==loc(d).slice(0,10)).map(n=>{const[hh,mm]=(n.tm||'0:0').split(':');return`<button class="ev" data-nn="${n.id}" style="top:${(+hh+mm/60)*48}px;height:20px;right:30%;background:#fef3c7;border-color:#f59e0b;color:#5b3a00">📝 ${esc(n.t||n.x.slice(0,20))}</button>`}).join('')}</div>`}
mv.innerHTML=h+'</div>'}}
function open_(id,pre){const e=id?S.ev.find(x=>x.id==id):pre;ed=id?e:null;$('#mh').textContent=id?'Edit event':'New event';$('#c').innerHTML=S.cal.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('');
$('#t').value=e.t||'';$('#c').value=e.cal||S.cal[0].id;$('#s').value=loc(e.s);$('#e').value=loc(e.a?e.e-1:e.e);$('#r').value=e.r||'';$('#u').value=e.u||'';$('#rm').value=e.rem??'';$('#l').value=e.l||'';$('#d').value=e.d||'';$('#ad').checked=!!e.a;$('#rn').value=e.n||1;$('#tv').value=e.tv||0;$('#kc').checked=!!e.k;$('#k').value=e.k||'#6c63ff';$('#dl').style.display=id?'':'none';$('#mm').showModal()}
$('#fm').onsubmit=async()=>{let s=+new Date($('#s').value),e=+new Date($('#e').value);if($('#ad').checked){s=+sd(s);e=Math.max(+sd(e)+D,s+D)}if(e<=s){toast('End must be after start');return}
const o={id:ed?ed.id:crypto.randomUUID(),a:$('#ad').checked,n:+$('#rn').value||1,tv:+$('#tv').value||0,k:$('#kc').checked?$('#k').value:'',x:ed&&ed.x,t:$('#t').value,cal:$('#c').value,s,e,r:$('#r').value,u:$('#u').value,rem:$('#rm').value===''?null:+$('#rm').value,l:$('#l').value,d:$('#d').value};
const cf=occ(s,e).filter(x=>x.e.id!=o.id);if(cf.length)toast(`⚠ Overlaps with “${cf[0].e.t}”`);
S.ev=S.ev.filter(x=>x.id!=o.id).concat(o);await save()};
$('#cx').onclick=()=>$('#mm').close();$('#dl').onclick=async()=>{const bk=JSON.stringify(S.ev);if(ed.r&&ods&&confirm('Delete only this occurrence? (Cancel = whole series)'))(ed.x=ed.x||[]).push(ods);else S.ev=S.ev.filter(x=>x.id!=ed.id);$('#mm').close();await save();toast('Deleted',()=>{S.ev=JSON.parse(bk);save()})};
$('#qa').onkeydown=async e=>{if(e.key=='Enter'&&e.target.value.trim()){const v=e.target.value;if(/^note:/i.test(v)){S.nt.push({id:crypto.randomUUID(),t:v.slice(5).trim().slice(0,40),x:v.slice(5).trim(),d:'',tm:'',p:0});e.target.value='';await save();toast('Note added');return}const o=nl(v);S.ev.push(o);e.target.value='';await save();toast(`Added “${o.t}” · ${new Date(o.s).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}`)}};
$('#se').oninput=e=>{Q=e.target.value.toLowerCase();render()};
$('#fr').onclick=()=>{const m=+prompt('How many minutes?','30');if(!m)return;const t=free(m);t?open_(null,{s:t,e:t+m*M,t:''}):toast('No free slot in 14 days (9–5, weekdays)')};
const nav=n=>{view=='month'?cur.setMonth(cur.getMonth()+n):cur=ad(cur,n*(view=='week'?7:view=='day'?1:30));render()};
$('#pv').onclick=()=>nav(-1);$('#nt').onclick=()=>nav(1);$('#td').onclick=()=>{cur=new Date();render()};$('#mn').onclick=()=>$('#mu').showModal();
document.body.addEventListener('click',e=>{const v=e.target.closest('[data-v]'),c=e.target.closest('.chip'),ev=e.target.closest('.ev');
if(v){view=v.dataset.v;render()}else if(c){const k=S.cal.find(x=>x.id==c.dataset.id);k.v=k.v?0:1;save()}else if(e.target.closest('[data-nn]'))nopen(S.nt.find(n=>n.id==e.target.closest('[data-nn]').dataset.nn));else if(ev){ods=+ev.dataset.s;open_(ev.dataset.i)}});
$('#mv').ondblclick=e=>{if(e.target.closest('.ev'))return;const c=e.target.closest('[data-d]');if(!c)return;let s=+c.dataset.d+9*36e5;if(c.classList.contains('col'))s=+c.dataset.d+Math.round((e.clientY-c.getBoundingClientRect().top)/48*4)/4*36e5;if(e.altKey){nopen({d:loc(s).slice(0,10),tm:c.classList.contains('col')?loc(s).slice(11):''});return}open_(null,{s,e:s+36e5,t:''})};
const dl=(n,t,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
const ics=()=>'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Orbit//EN\r\n'+S.ev.map(e=>{const z=x=>new Date(x).toISOString().replace(/[-:]|\.\d+/g,'');return`BEGIN:VEVENT\r\nUID:${e.id}\r\nDTSTAMP:${z(Date.now())}\r\nDTSTART:${z(e.s)}\r\nDTEND:${z(e.e)}\r\nSUMMARY:${e.t}\r\n${e.l?'LOCATION:'+e.l+'\r\n':''}${e.r?'RRULE:FREQ='+{d:'DAILY',w:'WEEKLY',m:'MONTHLY',y:'YEARLY'}[e.r]+';INTERVAL='+(e.n||1)+'\r\n':''}END:VEVENT\r\n`}).join('')+'END:VCALENDAR';
let imp='';$('#mu').onclick=async e=>{const a=e.target.dataset.a;if(!a)return;$('#mu').close();
if(a=='ac'){const n=prompt('Calendar name?');if(n){S.cal.push({id:crypto.randomUUID(),n,c:'#'+Math.floor(Math.random()*0x888888+0x666666).toString(16),v:1});save()}}
if(a=='ex')dl('orbit-backup.json',JSON.stringify(S),'application/json');if(a=='ics')dl('orbit.ics',ics(),'text/calendar');
if(a=='im'||a=='ii'){imp=a;$('#fi').click()}
if(a=='wx')wxon();
if(a=='av'){const t=avail();navigator.clipboard?.writeText(t);toast('Availability copied to clipboard')}
if(a=='nf')toast('Notifications: '+await Notification.requestPermission());

async function wxload(){try{const p=JSON.parse(localStorage.wx||'null');if(!p)return;const key=p.lat+','+p.lon,c=await kv('get','wx');if(c&&c.k==key&&Date.now()-c.t<108e5)WX=c.d;else{const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`)).json();WX={};r.daily.time.forEach((t,i)=>WX[t]={c:r.daily.weathercode[i],h:Math.round(r.daily.temperature_2m_max[i]),l:Math.round(r.daily.temperature_2m_min[i]),p:r.daily.precipitation_probability_max[i]});await kv('put','wx',{t:Date.now(),k:key,d:WX})}}catch(e){const c=await kv('get','wx');if(c)WX=c.d;else toast('Weather unavailable — are you online?')}render()}
function avail(){const out=[];for(let i=0;i<7;i++){const d=ad(sd(new Date()),i);if(d.getDay()%6==0)continue;const r=[];let st=null;for(let t=+d+9*36e5;t<=+d+17*36e5;t+=18e5){const fr=t<+d+17*36e5&&t>Date.now()&&!occ(t,t+18e5).length;if(fr&&st==null)st=t;if(!fr&&st!=null){r.push(tm(st)+'–'+tm(t));st=null}}if(r.length)out.push(d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+': '+r.join(', '))}return"I'm free:\n"+out.join('\n')}
